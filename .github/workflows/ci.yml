name: FinGuard CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feature/**", "fix/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        env:
          DATABASE_URL: sqlite:///./ci-test.db
        run: pytest -q
      - name: Build Docker image (includes deterministic model training)
        run: docker build -t finguard-ai:${{ github.sha }} .
